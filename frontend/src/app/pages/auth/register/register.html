<section class="flex min-h-[calc(100vh-5rem)] items-center justify-center bg-slate-950 px-6 py-28 text-white">
  <form (ngSubmit)="registerAccount()" #registerForm="ngForm" class="w-full max-w-2xl rounded-3xl border border-white/10 bg-white/[0.05] p-7 sm:p-12">
    <div class="flex items-start justify-between gap-4">
      <div><p class="text-xs font-bold uppercase tracking-[0.2em] text-amber-300">Get started</p><h1 class="mt-3 text-3xl font-black">Create your account</h1><p class="mt-2 text-sm text-slate-400">Request access to your campus equipment workspace.</p></div>
      <img src="/dyci_img/dyci-logo.webp" alt="DYCI logo" class="h-12 w-12 object-contain">
    </div>
    @if (submitted) { <div class="mt-6 rounded-xl border border-emerald-400/30 bg-emerald-400/10 px-4 py-3 text-sm text-emerald-200">Registration request submitted. An administrator will review your access.</div> }
    <div class="mt-8 grid gap-5 sm:grid-cols-2">
      <label class="text-sm font-semibold text-slate-200">First name<input name="firstName" ngModel required class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 font-normal outline-none focus:border-blue-400"></label>
      <label class="text-sm font-semibold text-slate-200">Last name<input name="lastName" ngModel required class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 font-normal outline-none focus:border-blue-400"></label>
    </div>
    <label class="mt-5 block text-sm font-semibold text-slate-200">DYCI email address<input name="email" type="email" ngModel required class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 font-normal outline-none focus:border-blue-400" placeholder="you@dyci.edu.ph"></label>
    <label class="mt-5 block text-sm font-semibold text-slate-200">Your role<select name="role" ngModel required class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 font-normal outline-none focus:border-blue-400"><option value="">Select your role</option><option>Faculty or department head</option><option>Property or lab custodian</option><option>IT/MIS or technician</option></select></label>
    <label class="mt-5 block text-sm font-semibold text-slate-200">Create password<input name="password" type="password" ngModel required minlength="8" class="mt-2 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 font-normal outline-none focus:border-blue-400" placeholder="At least 8 characters"></label>
    <button type="submit" [disabled]="registerForm.invalid" class="mt-7 w-full rounded-xl bg-blue-600 px-6 py-3.5 text-sm font-bold text-white hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">Request account</button>
    <p class="mt-7 text-center text-sm text-slate-400">Already have access? <a routerLink="/login" class="font-bold text-blue-300 hover:text-blue-200">Sign in</a></p>
  </form>
</section>
