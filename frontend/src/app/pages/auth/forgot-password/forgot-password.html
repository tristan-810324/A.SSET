<section class="flex min-h-screen items-center justify-center bg-slate-950 px-6 py-10 text-white sm:px-10">
  <form (ngSubmit)="sendReset()" #resetForm="ngForm" class="w-full max-w-lg rounded-3xl border border-white/10 bg-white/[0.05] p-7 text-center sm:p-12">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600/20 text-2xl text-blue-300">?</div>
    <p class="mt-7 text-xs font-bold uppercase tracking-[0.2em] text-blue-300">Account recovery</p>
    <h1 class="mt-3 text-3xl font-black">Forgot your password?</h1>
    <p class="mt-3 text-sm leading-6 text-slate-400">Enter your DYCI email and we’ll help you get back into the portal.</p>
    @if (submitted) { <div class="mt-6 rounded-xl border border-emerald-400/30 bg-emerald-400/10 px-4 py-3 text-left text-sm text-emerald-200">If an account exists for that email, recovery instructions will be sent.</div> }
    <input name="email" type="email" ngModel required class="mt-8 w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-left outline-none focus:border-blue-400" placeholder="you@dyci.edu.ph">
    <button type="submit" [disabled]="resetForm.invalid" class="mt-4 w-full rounded-xl bg-blue-600 px-6 py-3.5 text-sm font-bold hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">Send recovery link</button>
    <a routerLink="/login" class="mt-6 inline-block text-sm font-bold text-blue-300 hover:text-blue-200">← Back to sign in</a>
  </form>
</section>
