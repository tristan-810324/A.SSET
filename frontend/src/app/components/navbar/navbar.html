<!-- Responsive navigation -->
<header class="fixed inset-x-0 top-5 z-50 flex justify-center px-4 sm:px-6">
  <nav class="flex w-full max-w-6xl items-center justify-between gap-5 rounded-full border border-white/20 bg-slate-950/75 px-5 py-3.5 shadow-2xl backdrop-blur-2xl sm:px-7">
    
    <!-- Logo at Brand Name (Mas malaking logo) -->
    <div class="flex min-w-0 items-center gap-3">
      <img src="/dyci_img/dyci-logo.webp" alt="DYCI Logo" class="h-11 w-11 shrink-0 object-contain drop-shadow-lg sm:h-12 sm:w-12">
      <div class="flex flex-col">
        <span class="text-lg font-black tracking-[0.18em] text-white sm:text-xl">A.SSET</span>
        <span class="hidden text-[0.6rem] font-bold uppercase tracking-wider text-blue-400 sm:block">DYCI Equipment Tracking</span>
      </div>
    </div>
    
    <!-- Navigation Links -->
    <div class="hidden items-center gap-8 text-xs font-bold uppercase tracking-wider text-slate-300 lg:flex">
      <a routerLink="/" routerLinkActive="text-white" [routerLinkActiveOptions]="{ exact: true }" class="hover:text-blue-400 transition-colors">Home</a>
      <a routerLink="/about" routerLinkActive="text-white" class="hover:text-blue-400 transition-colors">About</a>
      <a routerLink="/contact" routerLinkActive="text-white" class="hover:text-blue-400 transition-colors">Contact</a>
    </div>

    <!-- Login Button -->
    <div>
      <a routerLink="/login" class="rounded-full bg-linear-to-r from-blue-600 to-blue-500 px-5 py-2.5 text-xs font-extrabold uppercase tracking-wider text-white shadow-lg shadow-blue-600/40 transition-all hover:-translate-y-0.5 hover:from-blue-500 hover:to-blue-400 sm:px-6">
        Login Portal
      </a>
    </div>

  </nav>
</header>
